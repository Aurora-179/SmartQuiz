# SmartQuiz Next.js - Nginx Reverse Proxy Configuration

upstream smart_quiz_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # HTTP to HTTPS Redirect (Uncomment after SSL is configured)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://smart_quiz_app;
        proxy_http_version 1.1;

        # WebSocket support (for Next.js HMR & Real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache Next.js Static Assets
    location /_next/static/ {
        proxy_pass http://smart_quiz_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files
    location /public/ {
        proxy_pass http://smart_quiz_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }
}

